<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الكلمات المتقاطعة</title>
    <meta name="description" content="لعبة كلمات متقاطعة تفاعلية وممتعة.">
    <meta name="author" content="هيثم غانم أحمد زيدان">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">
    
    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-ui">
        <!-- الشريط العلوي -->
        <div class="top-bar d-flex justify-content-between align-items-center w-100">
            <div>
                <a href="index.html" onclick="showLevelsScreen(); return false;" class="text-white text-decoration-none fw-bold fs-6">
                    <i class="fas fa-puzzle-piece text-warning"></i> الكلمات المتقاطعة
                </a>
            </div>
            <div>
                <span class="fs-6 fw-bold"><i class="fas fa-star text-warning"></i> النقاط: <span id="score-display">0</span>/100</span>
            </div>
         
        </div>

        <!-- حاوية المحتوى الرئيسي (تمنع التمرير وتتطابق مع ارتفاع الشاشة) -->
        <div class="content-wrapper">
            <!-- شاشة المراحل -->
            <div class="main-container" id="levels-screen">
            
                <h5 class="text-center mb-2 fw-bold text-primary">المراحل (20)</h5>
                         <div>
            <button id="installAppBtn" class="btn btn-light btn-sm py-0 px-2 me-1" style="display: none;">
                    <i class="fas fa-download"></i> تثبيت
                </button>
                <button onclick="shareApp()" class="btn btn-light btn-sm py-0 px-2">
                    <i class="fas fa-share-alt"></i>
                </button>
            </div>
                <div class="row g-2 overflow-auto flex-grow-1 align-content-start" id="levels-grid"></div>
       
            </div>
   
            <!-- شاشة اللعب -->
            <div class="main-container" id="game-screen" style="display: none;">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <button class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="showLevelsScreen()">
                        <i class="fas fa-arrow-right"></i> رجوع
                    </button>
                    <h6 class="text-primary fw-bold mb-0">المرحلة <span id="current-level-title"></span></h6>
                    <div>
                        <button class="btn btn-success btn-sm py-0 px-2 shadow-sm fw-bold" onclick="checkAnswer()">تحقق</button>
                    </div>
                </div>

                <div class="game-content">
                    <!-- التلميحات -->
                    <div class="hints-section bg-light p-2 shadow-sm">
                        <h6 class="fw-bold text-warning mb-1 fs-6"><i class="fas fa-lightbulb"></i> التلميحات:</h6>
                        <ul id="hints-list" class="mb-0 lh-sm ps-3"></ul>
                    </div>

                    <!-- مساحة الشبكة والحروف -->
                    <div class="grid-section">
                        <div id="crossword-container" class="mb-1"></div>
                        <div id="letters-container" class="w-100"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- الـ Footer السفلي المدمج وغير القابل للاقتصاص -->
        <footer class="app-footer d-flex justify-content-center align-items-center gap-3">
            <span>تطوير وتصميم: <a href="https://github.com/wazefapress" target="_blank" class="text-decoration-none fw-bold text-primary">هيثم زيدان</a></span>
            <a href="https://github.com/wazefapress/Crossword-Puzzle-Game" target="_blank" class="text-dark text-decoration-none fw-bold">
                <i class="fab fa-github"></i> GitHub
            </a>
        </footer>
    </div>

    <audio id="audio-win-level" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>
    <audio id="audio-win-game" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
