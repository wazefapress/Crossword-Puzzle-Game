<head>
    <meta charset="UTF-8">

    <meta name="keywords" content="كلمات متقاطعة, ألعاب ترفيهية, لعبة تعليمية, جغرافيا, علوم, ألعاب براوزر, هيثم زيدان">

    <!-- ========================================== -->
    <!--      SEO لوسائل التواصل الاجتماعي (Open Graph)      -->
    <!-- (تستخدمها واتساب، فيسبوك، لينكدإن، تيليجرام)      -->

    <meta property="og:title" content="لعبة الكلمات المتقاطعة - 20 مرحلة مشوقة في الجغرافيا والعلوم">
    <meta property="og:description" content="تحدى نفسك واجتاز 20 مرحلة تفاعلية من الكلمات المتقاطعة. طوّر معلوماتك واكسب النقاط الآن!">
    <meta property="og:url" content="https://wazefapress.github.io/Crossword-Puzzle-Game/"> 
    <meta property="og:image" content="icon512.png"> <!-- ضع رابط صورة معاينة للعبة (بُعد مناسب 1200×630) -->

    <meta property="og:locale" content="ar_AR">

    <!-- ========================================== -->
    <!--            بطاقات تويتر (Twitter Cards)     -->
    <!-- ========================================== -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="لعبة الكلمات المتقاطعة - تحدى معلوماتك العامة">
    <meta name="twitter:description" content="العب الآن لعبة الكلمات المتقاطعة التفاعلية عبر 20 مرحلة في الجغرافيا والعلوم.">
    <meta name="twitter:image" content="icon512.png"> <!-- ضع رابط صورة المعاينة هنا أيضاً -->
    <!-- ربط ملف الـ Manifest -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d6efd">
    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="style.css">
   
</head>
<body>

    <!-- Navigation / Stats -->
    <div class="container mb-4">
        <div class="top-bar d-flex justify-content-between align-items-center">
            <div>
                <span class="fs-5"><i class="fas fa-star text-warning"></i> النقاط: <span id="score-display">0</span>/100</span>
            </div>
            <div>
                <button id="installAppBtn" class="btn btn-light btn-sm me-2" style="display: none;">
                    <i class="fas fa-download"></i> تثبيت
                </button>
                <button onclick="shareApp()" class="btn btn-light btn-sm">
                    <i class="fas fa-share-alt"></i> مشاركة
                </button>
            </div>
        </div>
    </div>

    <!-- Levels Screen -->
    <div class="container" id="levels-screen">
        <h2 class="text-center mb-4 fw-bold text-primary">المراحل (20)</h2>
        <div class="row g-3" id="levels-grid"></div>
    </div>

    <!-- Game Screen -->
    <div class="container" id="game-screen" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <button class="btn btn-outline-secondary" onclick="showLevelsScreen()">
                <i class="fas fa-arrow-right"></i> المراحل
            </button>
            <h3 class="text-primary fw-bold mb-0">المرحلة <span id="current-level-title"></span></h3>
            <div style="width: 80px;"></div>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body text-center overflow-auto">
                <div id="crossword-container" class="mb-4 mx-auto"></div>
                
                <div class="hints text-start bg-light p-3" style="border-radius: 10px; border-right: 5px solid #0d6efd;">
                    <h5 class="fw-bold"><i class="fas fa-lightbulb text-warning"></i> التلميحات:</h5>
                    <ul id="hints-list" class="mb-0 fs-6 lh-lg"></ul>
                </div>
            </div>
        </div>

        <div class="text-center">
            <button class="btn btn-primary btn-lg px-5 rounded-pill shadow" onclick="checkAnswer()">
                تحقق من الإجابة <i class="fas fa-check-circle"></i>
            </button>
        </div>
    </div>

    <!-- Footer -->
    <div class="container pb-4">
        <footer>
            <div class="text-center">
                <p class="mb-2 fs-5">تطوير وتصميم: 
                    <a href="https://github.com/wazefapress" target="_blank" class="text-decoration-none fw-bold text-primary">هيثم زيدان</a>
                </p>
                <a href="https://github.com/wazefapress/Crossword-Puzzle-Game" target="_blank" class="btn btn-dark btn-sm rounded-pill px-4">
                    <i class="fab fa-github"></i> رابط اللعبة على Github
                </a>
            </div>
        </footer>
    </div>

    <audio id="audio-win-level" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>
    <audio id="audio-win-game" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
       <script src="game.js"></script>


</body>
</html>
